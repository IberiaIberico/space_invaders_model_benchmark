<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Space Invaders</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;image-rendering:crisp-edges;image-rendering:pixelated}
</style>
</head>
<body>
<canvas id="c" width="224" height="256"></canvas>
<script>
const cv=document.getElementById('c'),X=cv.getContext('2d'),W=224,H=256,SHY=192,SHH=16,PY=216,FLOOR=239,UFOY=40,STEP=1/60;
X.imageSmoothingEnabled=false;

function spr(s){const r=s.split(' '),c=document.createElement('canvas'),x=c.getContext('2d');c.width=r[0].length;c.height=r.length;x.fillStyle='#fff';r.forEach((l,j)=>[...l].forEach((ch,i)=>ch=='#'&&x.fillRect(i,j,1,1)));c.b=r;return c}

const G={};
'0ehjlphe 14c4444e 2eh1248v 3v2421he 426aiv22 5vgu11he 668guhhe 7v124888 8ehhehhe 9ehhf12c A4ahhvhh Buhhuhhu Cehggghe Duhhhhhu Evgguggv Fvgguggg Gehgnhhf Hhhhvhhh Ie44444e J72222ic Khikokih Lggggggv Mhrllhhh Nhhpljhh Oehhhhhe Puhhuggg Qehhhlid Ruhhukih Sfgge11u Tv444444 Uhhhhhhe Vhhhhha4 Whhhllrh Xhha4ahh Yhha4444 Zv1248gv <248g842 >8421248 -000v000 =00v0v00 ?eh12404 *4le4el4'
.split(' ').forEach(t=>G[t[0]]=spr([...t.slice(1)].map(c=>parseInt(c,32).toString(2).padStart(5,'0').replace(/./g,b=>b>0?'#':'.')).join(' ')));
function text(s,x,y){[...s].forEach((c,i)=>G[c]&&X.drawImage(G[c],x+i*8,y))}
function center(s,y){text(s,(W-s.length*8+3)>>1,y)}
const pad=n=>String(n).padStart(4,'0');

const AS=[
[spr('...##... ..####.. .######. ##.##.## ######## ..#..#.. .#.##.#. #.#..#.#'),spr('...##... ..####.. .######. ##.##.## ######## .#.##.#. #......# .#....#.')],
[spr('..#.....#.. ...#...#... ..#######.. .##.###.##. ########### #.#######.# #.#.....#.# ...##.##...'),spr('..#.....#.. #..#...#..# #.#######.# ###.###.### ########### .#########. ..#.....#.. .#.......#.')],
[spr('....####.... .##########. ############ ###..##..### ############ ...##..##... ..##.##.##.. ##........##'),spr('....####.... .##########. ############ ###..##..### ############ ..###..###.. .##..##..##. ..##....##..')]],
AW=[8,11,12],AO=[4,2,2],AP=[30,20,10],
PL=spr('......#...... .....###..... .....###..... .###########. ############# ############# ############# #############'),
PX=[spr('...#.....#...... #.....#.....#... ..#..#.#..#..... .....#...#..#... .#..######.....# ...#########.#.. ..###########... .#############..'),
spr('#.......#.....#. ...#.......#.... .#...##......... ....#..#.#...#.. #..#.##.##...... ..##.######.#... .############..# .##############.')],
UFO=spr('.....######..... ...##########... ..############.. .##.##.##.##.##. ################ ..###..##..###.. ...#........#...'),
UFX=spr('..#..#....#...#..#... #....#.#.....#.#...#. ...#####.#.###...#... .##########.####.#... ..###.##..#####.#.... #..#.#.###.#.#.....#. ...#......#....#....# .#....#.#.....#..#...'),
AEX=spr('....#...#.... .#...#.#...#. ..#.......#.. ...#.....#... ##.........## ...#.....#... ..#..#.#..#.. .#..#...#..#.'),
PSX=spr('#...#..# ..#...#. .######. ######## ######## .######. ..#..#.. #..#...#'),
ASX=spr('..#... #...#. ..##.# .####. #.###. .##### #.###. .#.#.#'),
PS=spr('# # # #'),
SHS=spr('....##############.... ...################... ..##################.. .####################. '+'###################### '.repeat(7)+'########......######## ######..........###### #####............##### #####............##### #####............#####'),
ASH=[0,1,2].map(k=>[0,1,2,3].map(f=>spr([...Array(8)].map((_,j)=>{const r=['.','.','.'];if(k==2)r[[0,1,2,1][(j+f)%4]]='#';else{r[1]='#';if(k==1&&j==[1,3,5,7][f])r[0]=r[2]='#';if(k==0){if(j==2*f)r[2]='#';if(j==(2*f+4)%8)r[0]='#'}}return r.join('')}).join(' '))));
const UT=[100,50,50,100,150,100,100,50,300,100,100,100,50,150,100],CP=[1,7,1,1,1,4,11,1,6,3,1,1,11,9,2,8],CS=[11,1,6,3,1,1,11,9,2,8,2,11,4,7,10],
MC=[50,43,36,28,22,17,13,10,8,7,6,5,4,3,2,1],MD=[52,46,39,34,28,24,21,19,16,14,13,12,11,9,7,5],M=[62,55,49,46];

let ac,mg,nb,ufoSnd=null;
function initAudio(){if(ac){if(ac.state!='running')ac.resume();return}ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=.3;mg.connect(ac.destination);nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
function env(d,v){const g=ac.createGain(),t=ac.currentTime;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);g.connect(mg);return g}
function tone(type,f0,f1,d,v){if(!ac)return;const o=ac.createOscillator(),t=ac.currentTime;o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);o.connect(env(d,v));o.start(t);o.stop(t+d)}
function noise(d,f0,f1,v){if(!ac)return;const s=ac.createBufferSource(),f=ac.createBiquadFilter(),t=ac.currentTime;s.buffer=nb;s.loop=true;f.type='lowpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+d);s.connect(f).connect(env(d,v));s.start(t);s.stop(t+d)}
function wob(f,lf,ld,v,d){const t=ac.currentTime,o=ac.createOscillator(),l=ac.createOscillator(),lg=ac.createGain();o.type='square';o.frequency.setValueAtTime(f,t);l.frequency.value=lf;lg.gain.value=ld;l.connect(lg).connect(o.frequency);let g;if(d){g=env(d,v);o.frequency.linearRampToValueAtTime(f/3,t+d)}else{g=ac.createGain();g.gain.value=v;g.connect(mg)}o.connect(g);o.start(t);l.start(t);if(d){o.stop(t+d);l.stop(t+d)}return[o,l]}
function ufoStart(){if(ac&&!ufoSnd)ufoSnd=wob(400,8,150,.06)}
function ufoStop(){if(ufoSnd){ufoSnd.forEach(n=>n.stop());ufoSnd=null}}
const sShoot=()=>noise(.25,7000,400,.3),sKill=()=>{tone('square',900,90,.22,.22);noise(.1,5000,1000,.2)},sDie=()=>noise(1.3,2500,50,.9),sUfoHit=()=>ac&&wob(1000,16,300,.2,1);

let hi=0;try{hi=+localStorage.siHi||0}catch(e){}
let state='title',score=0,lives=0,wave=0,extra=0,shotsFired=0,px=16,pAlive=1,aliens=[],alive=0,cursor=0,dx=2,drop=0,reveal=0,ashots=[],ps={s:0},boom=null,ufo=null,ufoT=0,fireT=0,fireType=0,colI=[0,0,0],noteT=0,noteI=0,deathT=0,invaded=0,timer=0,frame=0,fx=[],fireReq=0,dirty=1;
const mask=new Uint8Array(W*SHH),floor=new Uint8Array(W).fill(1),K={};
const shC=document.createElement('canvas');shC.width=W;shC.height=SHH;const shX=shC.getContext('2d'),shI=shX.createImageData(W,SHH),sh32=new Uint32Array(shI.data.buffer);
function shDraw(){for(let i=0;i<mask.length;i++)sh32[i]=mask[i]?0xffffffff:0;shX.putImageData(shI,0,0);dirty=0}
function resetShields(){mask.fill(0);for(let k=0;k<4;k++){const sx=32+k*45;SHS.b.forEach((r,j)=>{for(let i=0;i<r.length;i++)if(r[i]=='#')mask[j*W+sx+i]=1})}dirty=1}
function erase(p,x,y){p.b.forEach((r,j)=>{const yy=y+j-SHY;if(yy>=0&&yy<SHH)for(let i=0;i<r.length;i++){const xx=x+i;if(r[i]=='#'&&xx>=0&&xx<W)mask[yy*W+xx]=0}});dirty=1}
function shieldHit(s,x,y,up){const h=s.height;for(let k=0;k<h;k++){const j=up?h-1-k:k,yy=y+j-SHY;if(yy<0||yy>=SHH)continue;for(let i=0;i<s.width;i++){const xx=x+i;if(xx>=0&&xx<W&&s.b[j][i]=='#'&&mask[yy*W+xx])return[xx,y+j]}}return null}
function hit(a,ax,ay,b,bx,by){const x0=Math.max(ax,bx),x1=Math.min(ax+a.width,bx+b.width),y0=Math.max(ay,by),y1=Math.min(ay+a.height,by+b.height);for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++)if(a.b[y-ay][x-ax]=='#'&&b.b[y-by][x-bx]=='#')return 1;return 0}
function eat(a){const o=a.x+AO[a.t];for(let y=Math.max(a.y,SHY);y<Math.min(a.y+8,SHY+SHH);y++){for(let x=o;x<o+AW[a.t];x++)mask[(y-SHY)*W+x]=0;dirty=1}}

function newGame(){score=0;lives=3;wave=0;extra=0;shotsFired=0;px=16;pAlive=1;floor.fill(1);aliens=[];ashots=[];ps={s:0};boom=null;ufo=null;deathT=0;invaded=0;state='start';timer=0}
function newWave(){const by=120+[0,24,40,48,48,48,56,56,56][Math.min(wave,8)];wave++;aliens=[];
 for(let r=0;r<5;r++)for(let c=0;c<11;c++)aliens.push({x:24+c*16,y:by-r*16,t:r<2?2:r<4?1:0,a:1,f:0});
 alive=55;cursor=0;dx=2;drop=0;reveal=0;ashots=[];ps={s:0};boom=null;ufo=null;ufoStop();ufoT=0;fireT=60;fireType=0;colI=[0,0,0];noteT=0;noteI=0;invaded=0;resetShields();state='play'}
function gameOver(){state='over';timer=0;ufo=null;ufoStop();try{localStorage.siHi=hi}catch(e){}}
function add(p){score+=p;if(!extra&&score>=1500){extra=1;lives++;tone('triangle',440,1760,.5,.4)}if(score>hi)hi=score}
function reload(){return score<200?48:score<1000?16:score<2000?11:score<3000?8:7}
function noteDelay(){let i=0;while(i<15&&alive<MC[i])i++;return MD[i]}
function bottom(c){for(let r=0;r<5;r++){const a=aliens[r*11+c];if(a.a)return a}}
const boomFx=(x,y)=>fx.push({i:ASX,x,y,t:8});
function pBoom(y){ps.s=2;ps.t=16;ps.ey=y}

function stepAliens(){
 if(!alive)return;
 for(let n=0;n<56;n++){
  if(cursor>=55){cursor=0;endSweep()}
  const a=aliens[cursor++];if(!a.a)continue;
  if(drop)a.y+=8;else a.x+=dx>0&&alive==1?3:dx;
  a.f^=1;eat(a);if(a.y+8>=PY)invaded=1;return}
}
function endSweep(){
 if(drop){drop=0;return}
 let L=W,R=0;for(const a of aliens)if(a.a){const o=a.x+AO[a.t];L=Math.min(L,o);R=Math.max(R,o+AW[a.t])}
 if((dx>0&&R>=216)||(dx<0&&L<=8)){drop=1;dx=-dx}
}
function alienFire(){
 if(--fireT>0)return;
 const k=fireType;fireType=(k+1)%3;
 if(ashots.some(s=>s.k==k)||(k==1&&alive==1))return;
 let a;
 if(!k){for(let c=0;c<11;c++){const b=bottom(c);if(b&&Math.abs(b.x+8-px-6)<8){a=b;break}}}
 else{const t=k==1?CP:CS;a=bottom(t[colI[k]++%t.length]-1)}
 if(!a)return;
 ashots.push({k,x:a.x+7,y:a.y+8,f:0});fireT=reload();
}
function aShotsUpd(){
 const sp=alive<=8?5:4;
 for(let i=ashots.length;i--;){const s=ashots[i];if(frame%3!=s.k)continue;
  s.y+=sp;s.f=(s.f+1)&3;const g=ASH[s.k][s.f];let h;
  if(hit(g,s.x,s.y,PL,px,PY)){ashots.splice(i,1);return killPlayer()}
  if((h=shieldHit(g,s.x,s.y,0))){erase(ASX,s.x-1,h[1]-2);boomFx(s.x-1,h[1]-2);ashots.splice(i,1)}
  else if(s.y+8>=FLOOR){boomFx(s.x-1,FLOOR-8);for(let j=0;j<6;j++)if(ASX.b[7][j]=='#')floor[s.x-1+j]=0;ashots.splice(i,1)}
 }
}
function psUpd(){
 ps.y-=4;
 for(let i=0;i<ashots.length;i++){const s=ashots[i];if(Math.abs(ps.x-s.x-1)<=1&&ps.y<s.y+8&&ps.y+8>s.y){ashots.splice(i,1);boomFx(s.x-1,s.y);return pBoom(ps.y-2)}}
 const h=shieldHit(PS,ps.x,ps.y,1);if(h){erase(PSX,ps.x-3,h[1]-4);return pBoom(h[1]-4)}
 if(ufo&&!ufo.s&&hit(PS,ps.x,ps.y,UFO,ufo.x,UFOY)){ufo.s=1;ufo.t=24;ufo.p=UT[shotsFired%15];add(ufo.p);ufoStop();sUfoHit();ps={s:0};return}
 for(const a of aliens)if(a.a&&hit(PS,ps.x,ps.y,AS[a.t][a.f],a.x+AO[a.t],a.y)){a.a=0;alive--;add(AP[a.t]);boom={x:a.x+1,y:a.y,t:16};ps={s:0};sKill();return}
 if(ps.y<=36)pBoom(34);
}
function ufoUpd(){
 if(!ufo){if(++ufoT>=1536&&alive>=8&&!deathT){ufoT=0;const d=shotsFired&1?-1:1;ufo={x:d>0?-16:W,d,s:0,t:0};ufoStart()}return}
 if(!ufo.s){ufo.x+=ufo.d;if(ufo.x<-16||ufo.x>W){ufo=null;ufoStop()}}
 else if(--ufo.t<=0){if(ufo.s==1){ufo.s=2;ufo.t=60}else ufo=null}
}
function killPlayer(){pAlive=0;deathT=100;ps={s:0};boom=null;sDie()}
function afterDeath(){ashots=[];lives=invaded?0:lives-1;if(lives<1)gameOver();else{pAlive=1;px=16}}

function play(fire){
 if(reveal<55){reveal++;return}
 ufoUpd();
 if(deathT){if(--deathT==0)afterDeath();return}
 if(K.ArrowLeft||K.KeyA)px=Math.max(16,px-1);
 if(K.ArrowRight||K.KeyD)px=Math.min(192,px+1);
 if(fire&&!ps.s&&!boom){ps={s:1,x:px+6,y:PY-4};shotsFired++;sShoot()}
 if(ps.s==1)psUpd();else if(ps.s==2&&--ps.t<=0)ps.s=0;
 if(boom){if(--boom.t<=0)boom=null}else stepAliens();
 if(invaded)return killPlayer();
 aShotsUpd();
 if(deathT)return;
 if(!alive){if(!boom){state='clear';timer=0;ashots=[];ufo=null;ufoStop()}return}
 alienFire();
 if(--noteT<=0){tone('square',M[noteI],M[noteI]*.98,.1,.5);noteI=(noteI+1)&3;noteT=noteDelay()}
}
function update(){
 frame++;const fire=fireReq;fireReq=0;
 fx=fx.filter(e=>--e.t>0);
 if(state=='start'){if(++timer>=120)newWave()}
 else if(state=='clear'){if(++timer>=90)newWave()}
 else if(state=='over'){if(++timer>420||(fire&&timer>90))state='title'}
 else if(state=='play')play(fire);
}

function render(){
 X.globalCompositeOperation='source-over';X.fillStyle='#000';X.fillRect(0,0,W,H);X.fillStyle='#fff';
 text('SCORE<1> HI-SCORE SCORE<2>',8,8);
 if(state!='start'||frame&16)text(pad(score),24,24);
 text(pad(hi),88,24);text('0000',168,24);
 for(let x=0;x<W;x++)floor[x]&&X.fillRect(x,FLOOR,1,1);
 text('CREDIT 00',136,241);
 if(state=='title'){
  center('PLAY',64);center('SPACE INVADERS',88);center('*SCORE ADVANCE TABLE*',120);
  X.drawImage(UFO,56,136);text('=? MYSTERY',80,136);
  X.drawImage(AS[0][0],60,152);text('=30 POINTS',80,152);
  X.drawImage(AS[1][0],58,168);text('=20 POINTS',80,168);
  X.drawImage(AS[2][0],58,184);text('=10 POINTS',80,184);
  if(frame&32)center('PRESS SPACE',216);
 }else{
  text(''+lives,8,241);for(let i=1;i<lives;i++)X.drawImage(PL,8+i*16,240);
  if(state=='start')center('PLAY PLAYER<1>',112);
  else{
   if(dirty)shDraw();X.drawImage(shC,0,SHY);
   aliens.forEach((a,i)=>a.a&&i<reveal&&X.drawImage(AS[a.t][a.f],a.x+AO[a.t],a.y));
   if(boom)X.drawImage(AEX,boom.x,boom.y);
   if(ufo){if(!ufo.s)X.drawImage(UFO,ufo.x,UFOY);else if(ufo.s==1)X.drawImage(UFX,ufo.x-2,UFOY);else text(''+ufo.p,ufo.x,UFOY)}
   ashots.forEach(s=>X.drawImage(ASH[s.k][s.f],s.x,s.y));
   if(ps.s==1)X.fillRect(ps.x,ps.y,1,4);else if(ps.s==2)X.drawImage(PSX,ps.x-3,ps.ey);
   fx.forEach(e=>X.drawImage(e.i,e.x,e.y));
   if(deathT)X.drawImage(PX[(deathT>>2)&1],px-1,PY);else if(pAlive)X.drawImage(PL,px,PY);
   if(state=='over')text('GAME OVER'.slice(0,timer/6|0),77,48);
  }
 }
 X.globalCompositeOperation='multiply';
 X.fillStyle='#ff2828';X.fillRect(0,32,W,16);
 X.fillStyle='#28ff28';X.fillRect(0,184,W,56);X.fillRect(24,240,112,16);
}

addEventListener('keydown',e=>{
 const k=e.code;if(['ArrowLeft','ArrowRight','Space','KeyA','KeyD','Enter'].includes(k))e.preventDefault();
 initAudio();if(e.repeat)return;K[k]=1;
 if(k=='Space'||k=='Enter'){if(state=='title')newGame();else if(k=='Space')fireReq=1}
});
addEventListener('keyup',e=>K[e.code]=0);
addEventListener('blur',()=>{for(const k in K)K[k]=0});
document.addEventListener('visibilitychange',()=>{if(ac)document.hidden?ac.suspend():ac.resume()});
function fit(){const s=Math.min(innerWidth/W,innerHeight/H),k=s>=1?Math.floor(s):s;cv.style.width=W*k+'px';cv.style.height=H*k+'px'}
addEventListener('resize',fit);fit();

let last=performance.now(),acc=0;
function loop(t){acc+=Math.min(.25,(t-last)/1000);last=t;while(acc>=STEP*.97){update();acc-=STEP}render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
