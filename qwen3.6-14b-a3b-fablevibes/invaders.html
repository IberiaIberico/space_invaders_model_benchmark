<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SPACE INVADERS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;font-family:'Courier New',monospace;color:#fff;overflow:hidden}
canvas{image-rendering:crisp-pixels;border:2px solid #333}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=640,H=480;
c.width=W;c.height=H;

// Sound system
let audioCtx=null;
function initAudio(){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)(new(window.Audio||window.webkitAudio)())}catch(e){}}
initAudio();

function playSound(type){
  if(!audioCtx)return;
  try{
    let src,rate=44000;
    switch(type){
      case'alien_move':src=new Float32Array(16);for(let i=0;i<16;i++)src[i]=Math.random()*2-1;break;
      case'shot':src=new Float32Array(8);for(let i=0;i<8;i++)src[i]=(i%2===0?1:-1)*.5;break;
      case'destroyed':src=new Float32Array(16);for(let i=0;i<16;i++)src[i]=Math.sin(i/4*Math.PI)*.7+.3;break;
      case'explosion':src=new Float32Array(24);for(let i=0;i<24;i++)src[i]=(i%3===0?1:0)*(1-i/24)+Math.random()*.3;break;
      case'ufo':src=new Float32Array(16);for(let i=0;i<16;i++)src[i]=Math.sin(i/8*Math.PI)*.5+.5;break;
    }
    const buf=audioCtx.createBuffer(audioCtx.SOUND_BUFFER_SIZE||4096);
    if(src)buf.set(new Float32Array(src));
    audioCtx.playSound(buf,rate);
  }catch(e){}
}

// Game state
const state={
  player:{x:W/2,y:H-50,speed:1},
  aliens:[],shields:[],shots:[],alienShots:[],explosions:[],ufo:null,
  score:0,lives:3,wave:1,gameOver:false,paused:false,
  keys:{},lastTime:0,fps:60,timer:0,ufoTimer:0,
  alienMoveCount:0,alienSpeed:250,lastAlienMove:0,
  shieldDamage:[],shieldHits:[],
  playerShotCooldown:0,playerMaxShots:1,
  waveComplete:false,waveTransition:0,
  gameOverTimer:0,gameOverPhase:'none' // 'explosion', 'fadeout', 'done'
};

// Draw pixel art functions
function drawPixelArt(x,y,scale=2){
  ctx.saveContext();
  ctx.imageSmoothing=false;
  ctx.scale(scale,scale);
  yield*ctx.drawImage(img,x/scale,y/scale,1,1);
  ctx.restoreContext();
}

// Draw alien shapes programmatically
function drawAlien(x,y,type){
  ctx.fillStyle='#fff';
  switch(type){
    case 0: // Basic square
      ctx.fillRect(x-6,y-6,12,12);
      break;
    case 1: // Diamond
      ctx.beginPath();ctx.moveTo(x,y-8);ctx.lineTo(x+8,y);ctx.lineTo(x,y+8);ctx.lineTo(x-8,y);ctx.fill();
      break;
    case 2: // Circle-ish
      ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();
      break;
    case 3: // Star
      for(let i=0;i<5;i++){
        const a=i*Math.PI*2/5-Math.PI/2;
        ctx.fillRect(x+Math.cos(a)*6-1,y+Math.sin(a)*6-1,3,3);
      }
      break;
    case 4: // Hexagon
      for(let i=0;i<6;i++){
        const a=i*Math.PI/3-Math.PI/2;
        ctx.fillRect(x+Math.cos(a)*7-1,y+Math.sin(a)*7-1,3,3);
      }
      break;
    case 5: // Triangle
      ctx.beginPath();ctx.moveTo(x,y-8);ctx.lineTo(x+8,y+6);ctx.lineTo(x-8,y+6);ctx.fill();
      break;
    default:
      ctx.fillRect(x-4,y-4,8,8);
  }
}

// Draw UFO shape
function drawUFO(x,y){
  ctx.fillStyle='#fff';
  // Body - hexagon-like
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3-Math.PI/2;
    ctx.fillRect(x+Math.cos(a)*10-1,y+Math.sin(a)*10-1,4,4);
  }
  // Wings
  ctx.fillRect(x-14,y-8,6,16);
  ctx.fillRect(x+9,y-8,6,16);
  // Top eye
  ctx.fillRect(x-3,y-12,6,4);
}

// Draw player cannon
function drawPlayerCannon(x,y){
  ctx.fillStyle='#fff';
  // Main body - rectangle with rounded corners
  ctx.fillRect(x-8,y-8,16,16);
  // Stem pointing down
  ctx.fillRect(x-2,y+8,4,8);
  // Tip of stem (triangle)
  ctx.beginPath();ctx.moveTo(x-3,y+16);ctx.lineTo(x+3,y+16);ctx.lineTo(x,y+19);ctx.fill();
}

// Draw shield/bunker
function drawShield(x,y){
  ctx.fillStyle='#fff';
  // Diamond shape for shields
  ctx.beginPath();ctx.moveTo(x,y-8);ctx.lineTo(x+8,y);ctx.lineTo(x,y+8);ctx.lineTo(x-8,y);ctx.fill();
}

// Draw projectile
function drawProjectile(x,y,up=true){
  ctx.fillStyle='#fff';
  if(up){
    ctx.fillRect(x-2,y-6,4,6);
    ctx.fillRect(x-1,y-3,2,3);
  }else{
    ctx.fillRect(x-2,y+2,4,6);
    ctx.fillRect(x-1,y+5,2,3);
  }
}

// Draw explosion effect
function drawExplosion(x,y){
  const colors=['#fff','#ff0','#f00'];
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4;
    ctx.fillStyle=colors[i%3];
    ctx.fillRect(x+Math.cos(a)*i-1,y+Math.sin(a)*i-1,2+i*0.5,2+i*0.5);
  }
}

// Initialize game objects
function initGame(){
  state.score=0;state.lives=3;state.wave=1;state.gameOver=false;
  state.player={x:W/2,y:H-50,speed:1};
  state.shields=[];state.explosions=[];state.ufo=null;
  state.shieldDamage=[0,0,0,0];state.shieldHits=[0,0,0,0];
  
  // Create shields
  for(let i=0;i<4;i++){
    const x=W/8*(i+1);
    state.shields.push({x,y:H-120-i*30,damage:0,hits:0});
  }
}

function createAliens(){
  state.aliens=[];
  const rows=5,cols=10;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const x=W/2+(c-cols/2)*48+r*36;
      const y=r*72+40;
      state.aliens.push({x,y,type:r%6,alive:true});
    }
  }
}

function createUFO(){
  if(state.ufo)return;
  state.ufo={x:Math.random()*W,y:-50,speed:1.5};
  playSound('ufo');
}

// Update logic
function updateGame(time){
  const dt=Math.min((time-state.lastTime)/16.67,3); // Cap delta time
  state.lastTime=time;
  
  if(state.gameOver)return;
  
  // Player movement
  if(state.keys['ArrowLeft']||state.keys['a']){
    state.player.x-=state.player.speed*dt*20;
    if(state.player.x<48)state.player.x=48;
  }
  if(state.keys['ArrowRight']||state.keys['d']){
    state.player.x+=state.player.speed*dt*20;
    if(state.player.x>W-48)state.player.x=W-48;
  }
  
  // Player shooting (space key, one shot at a time)
  if(state.keys[' ']&&state.playerShotCooldown<=0){
    const maxShots=state.playerMaxShots;
    let activeShots=0;
    for(const s of state.shots)if(s.alive)activeShots++;
    if(activeShots<maxShots){
      state.shots.push({x:state.player.x,y:state.player.y,alive:true});
      playSound('shot');
      state.playerShotCooldown=150; // ms cooldown
    }
  }
  if(state.playerShotCooldown>0)state.playerShotCooldown-=dt*16.67;
  
  // Update player shots
  for(const s of state.shots){
    if(s.alive)s.y-=dt*30;
    if(s.y<0||s.y>H)s.alive=false;
  }
  state.shots=state.shots.filter(s=>s.alive);
  
  // Alien movement (with progressive speed)
  const now=time;
  if(now-state.lastAlienMove>=state.alienSpeed){
    state.lastAlienMove=now;
    state.alienMoveCount++;
    
    for(const a of state.aliens){
      if(!a.alive)continue;
      
      // Horizontal movement
      const dir=a.dir||1;
      a.x+=dir*36*dt;
      
      // Reverse direction on edges
      if(a.x>W-48)a.dir=-1;
      else if(a.x<48)a.dir=1;
    }
    
    // Descend when reaching bottom edge (or after enough moves)
    let shouldDescend=false;
    for(const a of state.aliens){
      if(!a.alive)continue;
      if(a.y>H-72||state.alienMoveCount%3===0)shouldDescend=true;
    }
    
    if(shouldDescend){
      for(const a of state.aliens)a.y+=36*dt;
      
      // Check if all aliens reached bottom (game over condition)
      let allBottom=true;
      for(const a of state.aliens)if(a.alive&&a.y<H-100)allBottom=false;
      if(allBottom&&!state.gameOver){
        gameOver();
        return;
      }
    }
    
    // Progressive speed increase (every 5 moves, decrease interval by 20ms)
    if(state.alienMoveCount%5===0&&state.alienSpeed>100){
      state.alienSpeed-=20;
      playSound('alien_move');
    }
  }
  
  // Update alien shots
  for(const s of state.alienShots){
    if(s.alive)s.y+=dt*30;
    if(s.y<0||s.y>H)s.alive=false;
  }
  state.alienShots=state.alienShots.filter(s=>s.alive);
  
  // UFO movement and crossing
  if(state.ufo){
    state.ufo.y+=state.ufo.speed*dt*20;
    
    // Cross top of screen
    if(state.ufo.y>50&&state.ufo.y<100){
      playSound('ufo');
      state.ufo=null;
    }
    
    // Remove UFO when it goes past bottom
    if(state.ufo.y>H+50)state.ufo=null;
  }
  
  // Randomly spawn UFO
  state.ufoTimer+=dt*16.67;
  if(state.ufoTimer>3000&&!state.ufo){
    createUFO();
    state.ufoTimer=0;
  }
  
  // Collision detection - player shots hitting aliens
  for(const s of state.shots){
    if(!s.alive)continue;
    for(const a of state.aliens){
      if(!a.alive)continue;
      if(Math.abs(s.x-a.x)<16&&Math.abs(s.y-a.y)<16){
        // Destroy alien
        a.alive=false;
        s.alive=false;
        state.score++;
        
        // Explosion effect
        state.explosions.push({x:a.x,y:a.y,time:0});
        playSound('destroyed');
      }
    }
  }
  
  // Collision detection - alien shots hitting shields
  for(const s of state.alienShots){
    if(!s.alive)continue;
    for(let i=0;i<state.shields.length;i++){
      const sh=state.shields[i];
      if(Math.abs(s.x-sh.x)<24&&Math.abs(s.y-sh.y)<16){
        state.shieldDamage[i]++;
        state.shieldHits[i]++;
        
        // Shield destruction at damage level 3
        if(state.shieldDamage[i]>=3){
          state.explosions.push({x:sh.x,y:sh.y,time:0});
          playSound('explosion');
          state.shields.splice(i,1);
        }
      }
    }
  }
  
  // Collision detection - player shots hitting shields
  for(const s of state.shots){
    if(!s.alive)continue;
    for(let i=0;i<state.shields.length;i++){
      const sh=state.shields[i];
      if(Math.abs(s.x-sh.x)<24&&Math.abs(s.y-sh.y)<16){
        state.shieldDamage[i]++;
        state.shieldHits[i]++;
        
        if(state.shieldDamage[i]>=3){
          state.explosions.push({x:sh.x,y:sh.y,time:0});
          playSound('explosion');
          state.shields.splice(i,1);
        }
      }
    }
  }
  
  // Update explosions
  for(const e of state.explosions)e.time+=dt*16.67;
  state.explosions=state.explosions.filter(e=>e.time<500);
  
  // Wave progression - after destroying all aliens, start new wave
  if(state.aliens.length>0){
    let allDestroyed=true;
    for(const a of state.aliens)if(a.alive)allDestroyed=false;
    
    if(allDestroyed&&!state.waveComplete){
      state.waveComplete=true;
      state.waveTransition=1;
      
      setTimeout(()=>{
        if(!state.gameOver){
          createAliens();
          // Rebuild shields for new wave
          state.shields=[];
          for(let i=0;i<4;i++){
            const x=W/8*(i+1);
            state.shields.push({x,y:H-120-i*30,damage:0,hits:0});
          }
          state.wave++;
        }
      },500);
    }
  }
  
  // Wave transition animation
  if(state.waveTransition>0)state.waveTransition-=dt*16.67;
}

function gameOver(){
  if(state.gameOver)return;
  state.gameOver=true;
  state.gameOverPhase='explosion';
  state.gameOverTimer=0;
  
  // Create explosion at player position
  state.explosions.push({x:state.player.x,y:state.player.y,time:0});
  playSound('explosion');
}

// Render logic
function renderGame(time){
  ctx.clearRect(0,0,W,H);
  
  // Background - black with subtle grid lines for arcade feel
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);
  
  // Draw shields
  for(const sh of state.shields){
    drawShield(sh.x,sh.y);
    
    // Damage indicator (small circles at bottom)
    const damageLevel=Math.min(state.shieldDamage[shields.indexOf(sh)],3);
    ctx.fillStyle='#fff';
    for(let i=0;i<damageLevel;i++){
      ctx.fillRect(sh.x-12+i*6,sh.y+12,4,4);
    }
  }
  
  // Draw aliens
  for(const a of state.aliens){
    if(!a.alive)continue;
    
    // Color based on row type (classic arcade colors)
    const colors=['#fff','#ff0','#f00','#0ff','#fff','#ff0'];
    ctx.fillStyle=colors[a.type];
    drawAlien(a.x,a.y,a.type);
  }
  
  // Draw UFO if present
  if(state.ufo){
    drawUFO(state.ufo.x,state.ufo.y);
  }
  
  // Draw player shots
  for(const s of state.shots){
    if(!s.alive)continue;
    drawProjectile(s.x,s.y,true);
  }
  
  // Draw alien shots
  for(const s of state.alienShots){
    if(!s.alive)continue;
    drawProjectile(s.x,s.y,false);
  }
  
  // Draw player cannon
  drawPlayerCannon(state.player.x,state.player.y);
  
  // Draw explosions
  for(const e of state.explosions){
    const progress=e.time/500;
    ctx.globalAlpha=1-progress*0.7;
    drawExplosion(e.x,e.y);
    ctx.globalAlpha=1;
  }
  
  // Wave transition overlay
  if(state.waveTransition>0){
    ctx.fillStyle=`rgba(0,0,0,${state.waveTransition})`;
    ctx.fillRect(0,0,W,H);
    
    ctx.font='bold 48px Courier New';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#fff';
    ctx.fillText(`WAVE ${state.wave}`,W/2,H/2);
  }
  
  // Game over overlay
  if(state.gameOver){
    const phase=state.gameOverPhase;
    
    if(phase==='explosion'){
      state.gameOverTimer+=16.67;
      if(state.gameOverTimer>500)state.gameOverPhase='fadeout';
    }else if(phase==='fadeout'){
      ctx.fillStyle=`rgba(0,0,0,${Math.min((state.gameOverTimer-500)/2000,1)})`;
      ctx.fillRect(0,0,W,H);
      
      ctx.font='bold 36px Courier New';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#fff';
      ctx.fillText('GAME OVER',W/2,H/2-40);
      ctx.font='18px Courier New';
      ctx.fillText(`SCORE: ${state.score}`,W/2,H/2+20);
      
      if(state.gameOverTimer>3000)state.gameOverPhase='done';
    }else{
      // Restart option after long delay
      const restartAlpha=Math.min((state.gameOverTimer-5000)/1000,1);
      ctx.fillStyle=`rgba(0,0,0,${restartAlpha})`;
      ctx.fillRect(0,0,W,H);
      
      ctx.font='bold 24px Courier New';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#fff';
      ctx.fillText('PRESS SPACE TO RESTART',W/2,H/2);
    }
  }
  
  // Score and lives display (top right corner)
  ctx.font='bold 16px Courier New';
  ctx.textAlign='right';ctx.textBaseline='top';
  ctx.fillStyle='#fff';
  ctx.fillText(`SCORE: ${state.score}`,W-20,10);
  
  // Lives display
  for(let i=0;i<3;i++){
    const lx=W-60-i*24;
    if(i<state.lives){
      ctx.fillStyle='#fff';
      ctx.fillRect(lx,8,16,16);
    }else{
      ctx.fillStyle='#555';
      ctx.fillRect(lx,8,16,16);
    }
  }
  
  // Wave indicator (top left)
  ctx.font='bold 14px Courier New';
  ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillStyle='#fff';
  ctx.fillText(`WAVE ${state.wave}`,20,10);
}

// Main game loop
let lastTime=performance.now();
function gameLoop(time){
  updateGame(time);
  renderGame(time);
  requestAnimationFrame(gameLoop);
}

// Keyboard event handling
document.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  
  state.keys[e.key]=true;
  
  // Restart on space after game over
  if(state.gameOver&&state.gameOverPhase==='done'&&e.key===' '){
    initGame();
    createAliens();
    state.gameOver=false;
    state.gameOverPhase='none';
    state.gameOverTimer=0;
  }
});

document.addEventListener('keyup',e=>{
  state.keys[e.key]=false;
});

// Initialize and start game
initGame();
createAliens();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
